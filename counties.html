<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>47 Counties - The ShuleShift</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;padding-bottom:80px}
header{background:#004aad;color:#fff;text-align:center;padding:25px 15px}
header h1{margin:0}
header p{margin:5px 0 0;opacity:.9}
.grid{max-width:900px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:#fff;padding:16px;border-radius:12px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.card h3{margin:0 0 5px}
.card p{margin:0;color:#666;font-size:13px}
.card a{display:inline-block;margin-top:10px;background:#004aad;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:999}
.bottom-nav a{text-decoration:none;color:#333;font-size:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.bottom-nav .icon{font-size:22px}
.menu-popup{display:none;position:fixed;bottom:70px;left:10px;right:10px;background:#fff;border-radius:16px;box-shadow:0 5px 25px rgba(0,0,0,.2);padding:10px;z-index:1000}
.menu-popup a{display:block;padding:14px;border-bottom:1px solid #f0f0f0;text-decoration:none;color:#111;font-weight:600}
</style>
</head>
<body>
<header><h1>📍 The ShuleShift</h1><p>Find School Space In All 47 Counties</p></header>
<div style="padding:20px 15px 0;max-width:900px;margin:0 auto"><h2 style="margin:0">Browse by County - Click a County</h2><p style="color:#666">Schools across all 47 counties</p></div>
<div class="grid" id="countyGrid"></div>
<div class="menu-popup" id="menuPopup">
<a href="index.html">🏠 Home</a><a href="counties.html">📍 Browse by County</a><a href="principal.html">👨🏾‍🏫 Principal Login</a><a href="contact.html">📞 Contact Us</a>
</div>
<div class="bottom-nav">
<a href="index.html"><span class="icon">🏠</span>Home</a>
<a href="counties.html"><span class="icon">🔍</span>Search</a>
<a href="principal.html"><span class="icon">🏫</span>School</a>
<a href="#" onclick="toggleMenu(event)"><span class="icon">☰</span>Menu</a>
</div>
<script>
const counties=["Baringo","Bomet","Bungoma","Busia","Elgeyo-Marakwet","Embu","Garissa","Homa Bay","Isiolo","Kajiado","Kakamega","Kericho","Kiambu","Kilifi","Kirinyaga","Kisii","Kisumu","Kitui","Kwale","Laikipia","Lamu","Machakos","Makueni","Mandera","Marsabit","Meru","Migori","Mombasa","Muranga","Nairobi","Nakuru","Nandi","Narok","Nyamira","Nyandarua","Nyeri","Samburu","Siaya","Taita-Taveta","Tana River","Tharaka-Nithi","Trans Nzoia","Turkana","Uasin Gishu","Vihiga","Wajir","West Pokot"];
document.getElementById('countyGrid').innerHTML=counties.map(c=>`<div class="card"><h3>${c}</h3><p>0 school(s)</p><a href="counties.html?county=${c}">View Spaces</a></div>`).join('');
function toggleMenu(e){e.preventDefault();const m=document.getElementById('menuPopup');m.style.display=m.style.display==='block'?'none':'block';}
</script>
</body>
</html>
