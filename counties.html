<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>47 Counties - The ShuleShift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;margin:0;background:#F8FAFC;color:#0F172A;padding-bottom:90px}
.topbar{background:#0F2A5C;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto}
.logo{font-weight:800;font-size:20px}.logo span{color:#FBBF24}
.topbar a{color:#fff;text-decoration:none;font-size:13px;font-weight:600;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px}
.hero{background:linear-gradient(135deg,#0F2A5C,#1D4ED8);color:#fff;padding:32px 20px;text-align:center}
.hero h1{margin:0;font-size:28px}
.hero p{opacity:.85;margin:8px 0 0}
.search{max-width:600px;margin:-18px auto 0;background:#fff;padding:8px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;gap:6px;position:relative;z-index:2}
.search input{flex:1;border:0;outline:none;padding:13px 16px;font-size:15px;border-radius:999px}
.search button{background:#0F2A5C;color:#fff;border:0;padding:12px 20px;border-radius:999px;font-weight:700}
.wrap{max-width:1000px;margin:24px auto 0;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:16px}
.card h3{margin:0;font-size:16px}
.card p{margin:4px 0 0;color:#64748B;font-size:13px}
.card a{display:inline-block;margin-top:12px;background:#EFF6FF;color:#1D4ED8;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E2E8F0;display:flex;justify-content:space-around;padding:10px 0 14px;z-index:999}
.bottom-nav a{text-decoration:none;color:#64748B;font-size:11px;font-weight:600;text-align:center;display:flex;flex-direction:column;gap:3px}
.bottom-nav a.active{color:#0F2A5C}
.bottom-nav .icon{font-size:22px}
.menu-popup{display:none;position:fixed;bottom:72px;left:12px;right:12px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:8px;z-index:1000}
.menu-popup a{display:block;padding:15px 14px;border-bottom:1px solid #F1F5F9;text-decoration:none;color:#0F172A;font-weight:600}
</style>
</head>
<body>
<div style="background:#0F2A5C"><div class="topbar"><div class="logo">The Shule<span>Shift</span></div><a href="index.html">← Home</a></div></div>
<div class="hero"><h1>Browse by County</h1><p>47 Counties • Tap a county to see schools</p></div>
<div style="padding:0 16px"><div class="search"><input id="filter" oninput="filterCounties()" placeholder="🔍 Search county..."><button onclick="filterCounties()">Search</button></div></div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div class="menu-popup" id="menuPopup"><a href="index.html">🏠 Home</a><a href="counties.html">📍 Browse by County</a><a href="principal.html">👨🏾‍🏫 Principal Login</a><a href="contact.html">📞 Contact Us</a></div>
<div class="bottom-nav"><a href="index.html"><span class="icon">🏠</span>Home</a><a href="counties.html" class="active"><span class="icon">🔍</span>Search</a><a href="principal.html"><span class="icon">🏫</span>School</a><a href="#" onclick="toggleMenu(event)"><span class="icon">☰</span>Menu</a></div>
<script>
const counties=["Baringo","Bomet","Bungoma","Busia","Elgeyo-Marakwet","Embu","Garissa","Homa Bay","Isiolo","Kajiado","Kakamega","Kericho","Kiambu","Kilifi","Kirinyaga","Kisii","Kisumu","Kitui","Kwale","Laikipia","Lamu","Machakos","Makueni","Mandera","Marsabit","Meru","Migori","Mombasa","Muranga","Nairobi","Nakuru","Nandi","Narok","Nyamira","Nyandarua","Nyeri","Samburu","Siaya","Taita-Taveta","Tana River","Tharaka-Nithi","Trans Nzoia","Turkana","Uasin Gishu","Vihiga","Wajir","West Pokot"];
function render(list){document.getElementById('grid').innerHTML=list.map(c=>`<div class="card"><h3>📍 ${c}</h3><p>Tap to view schools</p><a href="counties.html?county=${c}">View Spaces →</a></div>`).join('')}
render(counties);
function filterCounties(){const q=document.getElementById('filter').value.toLowerCase();render(counties.filter(c=>c.toLowerCase().includes(q)))}
function toggleMenu(e){e.preventDefault();const m=document.getElementById('menuPopup');m.style.display=m.style.display==='block'?'none':'block';}
</script>
</body>
</html>
